schema_version: 2
experiment:
  id: mr-debertabasev1-v3-dt4lm-fastga
  method: dt4lm-fastga
  seed: 765
  output_root: outputs/dt4lm-improvements
dataset:
  id: mr
  path: outputs/datasets/mr
  revision: null
  text_columns:
  - text
  label_column: label
  task_definition: Classify the movie review sentiment as negative or positive.
  evaluation:
    split: test
    sample_size: 1000
    sample_seed: 765
    manifest: outputs/dt4lm-improvements/sample_sets/mr/test-n1000-seed765.json
models:
  id: debertabasev1-v3
  old:
    name_or_path: outputs/finetuned/debertav1base_mr/best_model
    revision: null
  new:
    name_or_path: outputs/finetuned/debertav3base_mr/best_model
    revision: null
attack:
  recipe: faster-alzantot
  differential_objective: dynamic
  semantic_constraint: original
  query_budget: 1000
  recipe_parameters:
    max_candidates: 8
    max_percent: 0.2
    max_mse_dist: 0.5
    language_model_window_size: 6
    max_log_prob_diff: 5.0
    language_model_path: null
    population_size: 60
    max_iterations: 40
    post_crossover_check: false
  search:
    method: recipe_native
  model_batch_size: 32
semantic:
  threshold:
    source: none
calibration:
  enabled: false
evaluation:
  core:
    success_budgets:
    - 100
    - 200
    - 300
    - 400
    - 500
    - 600
    - 700
    - 800
    - 900
    - 1000
  quality:
    bleu:
      enabled: true
    meteor:
      enabled: true
    rouge_l:
      enabled: true
    bertscore:
      enabled: true
      model_name_or_path: /mnt/huawei/nsq/models/microsoft/deberta-large-mnli
      num_layers: 17
      allow_remote_download: false
      device: cuda
      batch_size: 32
      idf: false
      rescale_with_baseline: false
      baseline_path: null
