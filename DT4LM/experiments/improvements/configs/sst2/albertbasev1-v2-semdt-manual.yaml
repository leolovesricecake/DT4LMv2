# Complete SST-2 SemDT sensitivity run with manual NLI thresholds.
schema_version: 2
experiment:
  id: sst2-albertbasev1-v2-semdt-manual
  method: semdt-manual
  seed: 765
  output_root: outputs/dt4lm-improvements
dataset:
  id: sst2
  path: outputs/datasets/sst2
  revision: null
  text_columns: [sentence]
  label_column: label
  task_definition: Classify the sentence sentiment as negative or positive.
  evaluation:
    split: test
    sample_size: 1000
    sample_seed: 765
    manifest: outputs/dt4lm-improvements/sample_sets/sst2/test-n1000-seed765.json
models:
  id: albertbasev1-v2
  old: {name_or_path: outputs/finetuned/albertbasev1_sst2/best_model, revision: null}
  new: {name_or_path: outputs/finetuned/albertbasev2_sst2/best_model, revision: null}
attack:
  recipe: kuleshov_var
  differential_objective: dynamic
  semantic_constraint: nli
  query_budget: 1000
semantic:
  nli:
    model_name_or_path: /mnt/huawei/nsq/models/FacebookAI/roberta-large-mnli
    revision: null
    tokenizer_revision: null
    allow_remote_download: false
    device: null
    dtype: float32
    batch_size: 32
    candidate_batch_size: 1024
    max_length: 512
    truncation_strategy: longest_first
  threshold:
    source: manual
    entailment: 0.90
    contradiction: 0.05
calibration:
  enabled: false
evaluation:
  core: {success_budgets: [100, 500, 1000]}
  quality:
    bleu: {enabled: true}
    meteor: {enabled: true}
    rouge_l: {enabled: true}
    bertscore:
      enabled: true
      model_name_or_path: /mnt/huawei/nsq/models/microsoft/deberta-large-mnli
      num_layers: 17
      allow_remote_download: false
      device: cuda
      batch_size: 32
      idf: false
      rescale_with_baseline: false
      baseline_path: null
