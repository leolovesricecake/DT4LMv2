# First-round RTE configuration; all relative paths resolve from DT4LM/.
seed: 765
query_budget: 1000
output_root: outputs/dt4lm-improvements

dataset:
  id: rte
  # This path is the default output of datasets/preprocess_dataset.py.
  path: outputs/datasets/rte
  name: null
  textattack_spec: outputs/datasets/rte
  calibration_split: train
  # The notebook-derived 8:1:1 preprocessing creates a labeled test split.
  test_split: test
  text_columns: [premise, hypothesis]
  label_column: label
  task_definition: Decide whether the premise entails the hypothesis.

models:
  old: outputs/albertbasev1_rte/best_model
  new: outputs/albertbasev2_rte/best_model
  old_revision: null
  new_revision: null

manifests:
  train: outputs/dt4lm-improvements/manifests/rte/train_manifest.json
  test: outputs/dt4lm-improvements/manifests/rte/test_manifest.json
  metadata: outputs/dt4lm-improvements/manifests/rte/manifest_metadata.json

# RTE's small validation split uses every jointly-correct test original.
sampling:
  test:
    strategy: all
  calibration_originals:
    strategy: random_up_to
    size: 500

nli:
  model: FacebookAI/roberta-large-mnli
  revision: null
  tokenizer_revision: null
  device: null
  dtype: float32
  batch_size: 32
  candidate_batch_size: 1024
  max_length: 512
  truncation_strategy: longest_first

calibration:
  output_root: outputs/dt4lm-improvements/calibration/rte
  # Base candidate collection axes are explicit and reproducible.
  candidate_collection:
    base_recipe: kuleshov_var
    differential_objective: dynamic
    semantic_constraint: original
  candidate_sample_size: 1000
  search_sample_size: 800
  minimum_validation_positives: 100
  maximum_total_labels: 2000
  trajectory_sample_size: 100
  annotation_batch_size: 32
  threshold_search:
    method: grid
    step: 0.01
    min_precision: 0.95
    bootstrap_samples: 10000
