schema_version: 2
experiment:
  id: rte-albertbasev1-v2-hard-pbs
  method: hard-pbs
  seed: 765
  output_root: outputs/dt4lm-improvements
dataset:
  id: rte
  path: outputs/datasets/rte
  revision: null
  text_columns:
  - premise
  - hypothesis
  label_column: label
  task_definition: Determine whether the premise entails the hypothesis.
  evaluation:
    split: test
    sample_size: 1000
    sample_seed: 765
    manifest: outputs/dt4lm-improvements/sample_sets/rte/test-n1000-seed765.json
models:
  id: albertbasev1-v2
  old:
    name_or_path: outputs/finetuned/albertbasev1_rte/best_model
    revision: null
  new:
    name_or_path: outputs/finetuned/albertbasev2_rte/best_model
    revision: null
attack:
  recipe: kuleshov_var
  differential_objective: dynamic
  semantic_constraint: original
  query_budget: 1000
  search:
    method: async_frontier
    ranking: feasibility_pareto
    beam_size: 5
    infeasible_state_policy: discard
    diagnostics:
      trace_enabled: false
semantic:
  threshold:
    source: none
calibration:
  enabled: false
evaluation:
  core:
    success_budgets:
    - 100
    - 200
    - 300
    - 400
    - 500
    - 600
    - 700
    - 800
    - 900
    - 1000
  quality:
    bleu:
      enabled: true
    meteor:
      enabled: true
    rouge_l:
      enabled: true
    bertscore:
      enabled: true
      model_name_or_path: /mnt/huawei/nsq/models/microsoft/deberta-large-mnli
      num_layers: 17
      allow_remote_download: false
      device: cuda
      batch_size: 32
      idf: false
      rescale_with_baseline: false
      baseline_path: null
