# Complete RTE SemDT run calibrated by one local Hugging Face judge.
schema_version: 2
experiment:
  id: rte-albertbasev1-v2-semdt-hf
  method: semdt-hf
  seed: 765
  output_root: outputs/dt4lm-improvements
dataset:
  id: rte
  path: outputs/datasets/rte
  revision: null
  text_columns: [premise, hypothesis]
  label_column: label
  task_definition: Determine whether the premise entails the hypothesis.
  evaluation:
    split: test
    sample_size: 1000
    sample_seed: 765
    manifest: outputs/dt4lm-improvements/sample_sets/rte/test-n1000-seed765.json
models:
  id: albertbasev1-v2
  old: {name_or_path: outputs/albertbasev1_rte/best_model, revision: null}
  new: {name_or_path: outputs/albertbasev2_rte/best_model, revision: null}
attack:
  recipe: kuleshov_var
  differential_objective: dynamic
  semantic_constraint: nli
  query_budget: 1000
semantic:
  nli:
    model_name_or_path: FacebookAI/roberta-large-mnli
    revision: null
    tokenizer_revision: null
    allow_remote_download: true
    device: null
    dtype: float32
    batch_size: 32
    candidate_batch_size: 1024
    max_length: 512
    truncation_strategy: longest_first
  threshold:
    source: calibrated
    backend: hf
    artifact: outputs/dt4lm-improvements/calibration/rte/albertbasev1-v2/hf/threshold.json
calibration:
  enabled: true
  output_dir: outputs/dt4lm-improvements/calibration/rte/albertbasev1-v2/hf
  source_sampling:
    split: train
    sample_size: 500
    sample_seed: 765
    manifest: outputs/dt4lm-improvements/sample_sets/rte/train-n500-seed765.json
  candidate_collection:
    recipe: kuleshov_var
    differential_objective: dynamic
    semantic_constraint: original
  candidate_sample_size: 1000
  search_sample_size: 800
  minimum_validation_positives: 100
  maximum_total_labels: 2000
  trajectory_sample_size: 100
  annotation_batch_size: 32
  threshold_search:
    method: grid
    step: 0.01
    min_precision: 0.95
    bootstrap_samples: 10000
  judge:
    backend: hf
    config_file: configs/hf.secret.yaml
evaluation:
  core: {success_budgets: [100, 500, 1000]}
  quality:
    bleu: {enabled: true}
    meteor: {enabled: true}
    rouge_l: {enabled: true}
    bertscore:
      enabled: true
      model_name_or_path: /mnt/huawei/nsq/models/microsoft/deberta-large-mnli
      num_layers: 17
      allow_remote_download: false
      device: cuda
      batch_size: 32
      idf: false
      rescale_with_baseline: false
      baseline_path: null
