# Copy this template to DT4LM/configs/<name>.secret.yaml for local runs.
# Both the corrected *.secret.yaml suffix and legacy *.secert.yaml suffix are ignored.
backend: openai

openai:
  model: deepseek-v4-pro
  base_url: https://api.deepseek.com
  api_key: replace-me
  timeout: 60
  max_retries: 3
  max_new_tokens: 32

hf:
  model: Qwen/Qwen2.5-7B-Instruct
  revision: null
  device: null
  dtype: float16
  batch_size: 4
  max_retries: 3
  max_new_tokens: 32
